<!doctype html>
<!-- NOCLIP - found-footage backrooms experience. Entry point: importmap + canvas + viewfinder overlay. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07070a">
<title>NOCLIP</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23c4b843'/%3E%3Crect x='11' y='4' width='10' height='5' fill='%23fffbe6'/%3E%3Crect x='14' y='13' width='4' height='9' fill='%23171512'/%3E%3Crect x='12' y='22' width='2' height='6' fill='%23171512'/%3E%3Crect x='18' y='22' width='2' height='6' fill='%23171512'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="gl"></canvas>

<div id="vf" aria-hidden="true">
  <div class="vf-corner tl"></div><div class="vf-corner tr"></div>
  <div class="vf-corner bl"></div><div class="vf-corner br"></div>
  <div id="vf-rec"><span class="dot"></span>REC</div>
  <div id="vf-bat"><span id="bat-lbl">BATT</span><span id="bat-bar"><i></i></span><span id="bat-pct">100</span></div>
  <div id="vf-time">00:00:00:00</div>
  <div id="vf-date">--/--/----</div>
  <div id="vf-sig">SIG <span id="sig-bar"><i></i></span></div>
  <div id="vf-mode">SP</div>
  <div id="vf-warn"></div>
  <div id="vf-sub"></div>
</div>

<div id="hint" data-controls="WASD move &nbsp;·&nbsp; SHIFT run &nbsp;·&nbsp; C crouch &nbsp;·&nbsp; Q look back &nbsp;·&nbsp; F light &nbsp;·&nbsp; T share tape">WASD move &nbsp;·&nbsp; SHIFT run &nbsp;·&nbsp; C crouch &nbsp;·&nbsp; Q look back &nbsp;·&nbsp; F light &nbsp;·&nbsp; T share tape</div>
<div id="tapecut"></div>
<div id="boot">TAPE 01<br><small>loading</small></div>

<script type="module" src="js/main.js?v=77e8fa21788113364"></script>
</body>
</html>
